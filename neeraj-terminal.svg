    <stop offset="0%" stop-color="#070b12"/>
    <stop offset="100%" stop-color="#0d141e"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="1.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .mono { font-family: "SFMono-Regular","Menlo","Monaco","Consolas","Liberation Mono",monospace; }
    .label { fill:#ffad42; }
    .value { fill:#72d7ff; }
    .cyan { fill:#57e6ff; }
    .green { fill:#45f28a; }
    .dim { fill:#53677a; }
    .ascii { fill:#d6e4ee; font-size:11px; letter-spacing:1.5px; }
    .scan { animation: scan 5s linear infinite; }
    .blink { animation: blink 1.1s steps(2,end) infinite; }
    @keyframes scan { 0%{opacity:.18} 50%{opacity:.05} 100%{opacity:.18} }
    @keyframes blink { 50%{opacity:0} }
  </style>
</defs>
